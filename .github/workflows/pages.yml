# Publica o jogo como site (GitHub Pages) para jogar no navegador do celular,
# inclusive no Safari do iPhone. A cada push, a pasta www/ vai para o branch gh-pages.
# Uma vez só: Settings → Pages → Source "Deploy from a branch" → gh-pages / (root).
name: Site (GitHub Pages)

on:
  push:
    branches: [main, claude/laughing-dirac-p6ybiw]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-web.js
      - name: Publicar www/ no branch gh-pages
        run: |
          cd www
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
