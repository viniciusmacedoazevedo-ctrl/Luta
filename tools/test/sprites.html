<script>
VF.Quality = { particles: 1, afterimages: true, textPops: true };
const ctx = document.getElementById('c').getContext('2d');
const mode = location.hash.slice(1) || 'idle';
VF.CHARACTERS.forEach((d, i) => {
  const col = i % 9, row = Math.floor(i / 9);
  const x = 90 + col * 195, y = 300 + row * 330;
  const f = { state: mode === 'victory' ? 'victory' : 'idle', vx: 0, def: d, skin: d.skin, anim: 0.3, hp: 1000 };
  let pose = mode === 'victory' ? (d.skin.victoryPose ? d.skin.victoryPose(0.3, f) : VF.Poses.victory(0.3)) : mode === 'attack' ? VF.Poses.P(VF.Poses.K[(d.anim.poses||{}).heavy || 'hook']) : VF.Poses.idle(0.3, f);
  if (d.partnerSkin) VF.Rig.draw(ctx, d.partnerSkin, pose, { x: x - 40, y, facing: 1, scale: 0.9 * 0.94, fighter: f, t: 0.3 });
  VF.Rig.draw(ctx, d.skin, pose, { x, y, facing: 1, scale: 0.9, fighter: f, t: 0.3, expr: mode === 'victory' ? 'happy' : 'normal' });
  ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText(d.name, x - 50, y + 22);
  VF.Rig.portrait(ctx, d.skin, 60 + i * 70, 1450, 64, {});
});
</script></body></html>
